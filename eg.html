<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable</title>
    <link rel="stylesheet" href="eg.css">
</head>
<body>
    <h1>Timetable</h1>
    <div class="timetable">
        <div class="day">
            <h2>Monday</h2>
            <div class="time-slot" data-details="OPERATING SYSTEM (JANIB SIR)">9:00 - 10:00 AM</div>
            <div class="time-slot" data-details="WEB PROGRAMMING(KALIMULLAH SIR)">10:00 - 11:00 AM</div>
            <div class="time-slot" data-details="DBMS(SANIYA MAAM)">11:00 - 12:00 PM</div>
            <div class="time-slot" data-details="LUNCH BREAK">12:00 - 1:00 PM</div>
            <div class="time-slot" data-details="CONTROL SYSTEM(NEERAJ SIR)">1:00 - 2:00 PM</div>
            <div class="time-slot" data-details="DIGITAL ELECTRONICS(FARIDA MAAM)">2:00 - 3:00 PM</div>
            <div class="time-slot" data-details="maths(idrees SIR)">3:00 - 4:00 PM</div>
        </div>
        <div class="day">
            <h2>Tuesday</h2>
            <div class="time-slot" data-details="OPERATING SYSTEM lab (JANIB SIR)">9:00 - 10:00 AM</div>
            <div class="time-slot" data-details="WEB PROGRAMMING lab (KALIMULLAH SIR)">10:00 - 11:00 AM</div>
            <div class="time-slot" data-details="DBMS lab(SANIYA MAAM)">11:00 - 12:00 PM</div>
            <div class="time-slot" data-details="LUNCH BREAK">12:00 - 1:00 PM</div>
            <div class="time-slot" data-details="CONTROL SYSTEM lab(NEERAJ SIR)">1:00 - 2:00 PM</div>
            <div class="time-slot" data-details="DIGITAL ELECTRONICS lab(FARIDA MAAM)">2:00 - 3:00 PM</div>
            <div class="time-slot" data-details="communication system lab(omkar SIR)">3:00 - 4:00 PM</div>
        </div>
    </div>
    <div id="details"></div>

    <script src="eg.js"></script>
</body>
</html>
